[package]
name = "sandy"
version = "1.1.0"
description = "Design-led Markdown app for Windows"
authors = ["dennicax"]
license = "MIT"
repository = "https://github.com/vibecodoor/sandy"
edition = "2021"
rust-version = "1.88"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "sandy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tempfile = "3"
# Delete-to-system-trash (rename/delete session): recoverable by design —
# Sandy never permanently deletes a note.
trash = "5"

# File import → Markdown (built-in, pure Rust; executes only when a non-.md
# file is opened, so zero cost to startup/typing). Adds a few MB to the
# binary, no external tools, no runtime hit.
htmd = "0.5"
zip = "2"
quick-xml = "0.37"
calamine = "0.26"
csv = "1.3"
regex-lite = "0.1"
pdf-extract = "0.7"
chardetng = "1.0.0"
encoding_rs = "0.8.35"

# One-click PDF export via WebView2 PrintToPdf (see pdf.rs). Reuses the exact
# webview2-com / windows versions already pulled in by wry, so this adds no new
# heavy compilation. Windows-only; elsewhere export falls back to the print dialog.
[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }

# Ship-size profile. panic stays "unwind" (the default):
# the atomic writer must never turn a poisoned lock into a process abort.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
